name: IRIS 공고 스크래핑
on:
  schedule:
    # 매일 새벽 06:15 KST = 전날 21:15 UTC (9시 전에 확실히 끝나도록 여유를 둠, 정각이 아닌 분으로 지정해 GitHub 지연 최소화)
    - cron: "15 21 * * *"
  workflow_dispatch: {}
concurrency:
  group: iris-scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run scraper
        run: python scraper.py
      - name: Run SROME scraper
        run: python srome_scraper.py
      - name: Commit results
        run: |
          git config user.name "iris-monitor-bot"
          git config user.email "actions@github.com"

          # 방금 새로 만든 결과 파일들을 임시로 보관해둔다
          mkdir -p /tmp/fresh_results
          cp -r results/. /tmp/fresh_results/

          # 병합을 시도하지 않고, 원격의 최신 상태 위에 방금 만든 결과로 그대로 덮어써서 커밋한다.
          # (결과 파일은 매번 전체를 새로 생성하는 것이라, 이전 버전과 줄 단위로 병합하려 하면
          #  거의 항상 충돌이 나기 때문에 이 방식이 안전하다)
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/fresh_results/. results/

          git add results/
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: update 공고 현황 ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
